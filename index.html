<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title> دبیرخانه میلیتاریسم</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080b0f;
      color: #f1f1f1;
      font-family: Tahoma, Arial, sans-serif;
      min-height: 100vh;
    }

    header {
      padding: 30px 20px;
      border-bottom: 1px solid #383838;
      background: #0d1117;
      text-align: center;
    }

    .eyebrow {
      color: #b9985a;
      font-size: 13px;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #8f969e;
      font-size: 14px;
      letter-spacing: 2px;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 35px 20px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #10151b;
      border: 1px solid #242b33;
      border-radius: 10px;
      padding: 18px;
    }

    .dot {
      width: 10px;
      height: 10px;
      background: #38c172;
      border-radius: 50%;
    }

    .status strong {
      color: #b9985a;
    }
  </style>
</head>

<body>

<header>
  <div class="eyebrow">NIGP's MILITARISM  HEADQUARTERS OFFICE</div>

  <h1>🏛 دبیرخانه میلیتاریسم</h1>

  <div class="subtitle">STATUS BOARD</div>
</header>

<main>

  <div class="status">
    <span class="dot"></span>

    <div>
      <strong>وضعیت سامانه:</strong>
      ستاد آنلاین و فعال است
    </div>
  </div>

</main>

</body>
</html>
